services:
  mongodb:
    image: mongo:7.0
    container_name: vikala-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: vikala
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - vikala-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/admin --username $$MONGO_INITDB_ROOT_USERNAME --password $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  # Vikala Bot - Production
  bot-prod:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: vikala-bot-prod
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
    networks:
      - vikala-network
    volumes:
      - ./logs:/app/logs
      - ./src/keys:/app/src/keys:ro
    depends_on:
      mongodb:
        condition: service_healthy
    profiles:
      - prod

  # Vikala Bot - Development (default)
  bot:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: vikala-bot-dev
    env_file:
      - .env
    environment:
      NODE_ENV: development
    networks:
      - vikala-network
    volumes:
      - ./src:/app/src
      - ./logs:/app/logs
      - ./src/keys:/app/src/keys:ro
      - /app/node_modules
    depends_on:
      mongodb:
        condition: service_healthy

networks:
  vikala-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
