# Production Docker Compose Configuration
# Usage: docker compose -f docker compose.yml -f docker compose.prod.yml up -d

version: '3.8'

services:
  mongodb:
    restart: always
    # Limit resources
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    # More frequent health checks
    healthcheck:
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  vikala:
    restart: always
    # Limit resources
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    # Production environment
    environment:
      NODE_ENV: production
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
